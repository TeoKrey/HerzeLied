<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Album — HerzeLied</title>

    <link rel="stylesheet" href="/frontend/style.css?v=20260918-7">
</head>

<body>

<header class="header">

    <a href="/" class="logo">
        HERZELIED
    </a>

    <div class="brand-mark-wrap" tabindex="0" aria-label="HerzeLied logo">
        <img
            class="brand-mark"
            src="/media/logo_v1.png"
            alt="HerzeLied"
        >
        <img
            class="brand-mark-preview"
            src="/media/logo_v1.png"
            alt=""
        >
    </div>

    <a href="/" class="back" data-translation="Назад">
        ← Zurück
    </a>

</header>


<main class="container">

    <!-- ALBUM HERO -->

    <section class="album-hero">

        <div class="album-cover-large">

            <img
                id="album-cover"
                src=""
                alt="Albumcover"
            >

        </div>


        <div class="album-details">

            <div id="release-type-label" class="section-label" data-translation="Альбом">
                ALBUM
            </div>

            <h1 id="album-title" data-translation="Название альбома">
                Wird geladen ...
            </h1>

            <p id="album-year" class="album-year" data-translation="Год выпуска">
            </p>

            <p id="album-track-count" class="album-track-count" data-translation="Количество треков">
            </p>

        </div>

    </section>


    <!-- TRACKLIST -->

    <section class="album-tracks">

        <div class="section-heading">

            <div>
                <div class="section-label" data-translation="Список треков">
                    TITELLISTE
                </div>

                <h2 data-translation="Песни">
                    Lieder
                </h2>
            </div>

        </div>


        <div id="album-songs" class="songs-grid">

            <div class="loading" data-translation="Загрузка треков ...">
                Titel werden geladen ...
            </div>

        </div>

    </section>

</main>


<!-- GLOBAL PLAYER -->

<div id="global-player" class="global-player">

    <div class="player-left">

        <div id="player-cover" class="player-cover"></div>

        <div class="player-info">

            <div id="player-title" class="player-title" data-translation="Сейчас ничего не играет">
                Nichts wird abgespielt
            </div>

            <div id="player-subtitle" class="player-subtitle" data-translation="Исполнитель">
                Rammstein
            </div>

        </div>

    </div>


    <div class="player-center">

        <div class="player-buttons">

            <button id="player-prev" class="player-button">
                ‹
            </button>

            <button id="player-play" class="player-play">
                ▶
            </button>

            <button id="player-next" class="player-button">
                ›
            </button>

        </div>


        <div class="player-progress">

            <span id="player-current">0:00</span>

            <div id="progress-container" class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <span id="player-duration">0:00</span>

        </div>

    </div>


    <div class="player-right">

        <a
            id="player-lyrics"
            class="lyrics-button"
            href="/frontend/song.html"
            aria-label="Liedtext öffnen"
            data-translation="Текст песни"
        >
            Tt
        </a>

        <button id="player-volume" class="volume-button">
            <span data-translation="Громкость">TON</span>
        </button>

        <input id="volume-control" class="volume-control" type="range" min="0" max="1" step="0.01" value="1">

    </div>


    <audio id="global-audio"></audio>

</div>


<script src="/frontend/script.js?v=20260918-8"></script>

</body>

</html>
