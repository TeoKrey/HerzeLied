<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Song — HerzeLied</title>

    <link rel="stylesheet" href="/frontend/style.css?v=20260918-7">
</head>

<body>

<header class="header">

    <a href="/" class="logo">
        HERZELIED
    </a>

    <div class="brand-mark-wrap" tabindex="0" aria-label="HerzeLied logo">
        <img
            class="brand-mark"
            src="/media/logo_v1.png"
            alt="HerzeLied"
        >
        <img
            class="brand-mark-preview"
            src="/media/logo_v1.png"
            alt=""
        >
    </div>

    <a href="/" class="back" data-translation="Назад">
        ← Zurück
    </a>

</header>


<main class="container song-page">

    <section class="song-hero">

        <div class="song-meta">

            <div
                id="track-number"
                class="section-label"
                data-translation="Трек"
            >
                TITEL 01
            </div>

            <div
                id="release-type-label"
                class="section-label"
                data-translation="Тип релиза"
            >
                ALBUM
            </div>

            <h1 id="song-title" data-translation="Название песни">
                Wird geladen ...
            </h1>

            <p
                id="song-duration"
                class="song-duration"
            ></p>

        </div>

    </section>


    <section class="lyrics-section">

        <div class="section-heading">

            <div>

                <div class="section-label" data-translation="Текст песни">
                    LIEDTEXTE
                </div>

                <h2 data-translation="Немецкий / Русский">
                    Deutsch / Russisch
                </h2>

            </div>

        </div>


        <div class="lyrics-header">

            <div data-translation="Немецкий">
                DEUTSCH
            </div>

            <div data-translation="Русский">
                RUSSISCH
            </div>

        </div>


        <div
            id="lyrics-rows"
            class="lyrics-rows"
        >

            <div class="lyrics-state" data-translation="Загрузка текста песни ...">
                Liedtexte werden geladen ...
            </div>

        </div>

    </section>

</main>


<!-- SAME PLAYER -->

<div id="global-player" class="global-player">

    <div class="player-left">

        <div id="player-cover" class="player-cover"></div>

        <div class="player-info">

            <div id="player-title" class="player-title" data-translation="Сейчас ничего не играет">
                Nichts wird abgespielt
            </div>

            <div id="player-subtitle" class="player-subtitle" data-translation="Исполнитель">
                Rammstein
            </div>

        </div>

    </div>


    <div class="player-center">

        <div class="player-buttons">

            <button
                id="player-prev"
                class="player-button"
            >
                ‹
            </button>

            <button
                id="player-play"
                class="player-play"
            >
                ▶
            </button>

            <button
                id="player-next"
                class="player-button"
            >
                ›
            </button>

        </div>


        <div class="player-progress">

            <span id="player-current">
                0:00
            </span>

            <div
                id="progress-container"
                class="progress-container"
            >
                <div
                    id="progress-bar"
                    class="progress-bar"
                ></div>
            </div>

            <span id="player-duration">
                0:00
            </span>

        </div>

    </div>


    <div class="player-right">

        <a
            id="player-lyrics"
            class="lyrics-button"
            href="/frontend/song.html"
            aria-label="Liedtext öffnen"
            data-translation="Текст песни"
        >
            Tt
        </a>

        <button
            id="player-volume"
            class="volume-button"
        >
            <span data-translation="Громкость">TON</span>
        </button>

        <input
            id="volume-control"
            class="volume-control"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>


    <audio id="global-audio"></audio>

</div>


<script src="/frontend/script.js?v=20260918-8"></script>

</body>

</html>
