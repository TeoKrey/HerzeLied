<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HerzeLied</title>

    <link rel="stylesheet" href="/frontend/style.css?v=20260918-7">
</head>

<body>

<header class="header">

    <a href="/" class="logo">
        HERZELIED
    </a>

    <div class="brand-mark-wrap" tabindex="0" aria-label="HerzeLied logo">
        <img
            class="brand-mark"
            src="/media/logo_v1.png"
            alt="HerzeLied"
        >
        <img
            class="brand-mark-preview"
            src="/media/logo_v1.png"
            alt=""
        >
    </div>

</header>


<main class="container">

    <!-- HERO -->

    <section class="hero">

        <div class="hero-glow"></div>

        <div class="hero-label" data-translation="Изучение немецкого с музыкой">
            DEUTSCH LERNEN MIT MUSIK
        </div>

        <h1 data-translation="Учим немецкий через музыку.">
            Lerne Deutsch<br>
            durch <span>Musik.</span>
        </h1>

        <p data-translation="Слушайте песни, читайте оригинальные тексты и узнавайте смысл каждой строки.">
            Höre Lieder, lies die Originaltexte
            und entdecke die Bedeutung jeder Zeile.
        </p>

    </section>


    <!-- ARTIST -->

    <section class="artist-section">

        <div class="section-label" data-translation="Исполнитель">
            KÜNSTLER
        </div>

        <h2 class="artist-name">
            Rammstein
        </h2>

    </section>


    <!-- ALBUMS -->

    <section class="albums-section">

        <div class="section-heading">

            <div>

                <div class="section-label" data-translation="Коллекция">
                    SAMMLUNG
                </div>

                <h2 data-translation="Альбомы">
                    Alben
                </h2>

            </div>

        </div>


        <div id="albums-container" class="albums-grid">

            <div class="loading" data-translation="Загрузка альбомов ...">
                Alben werden geladen ...
            </div>

        </div>

    </section>


    <!-- TRACKS -->

    <section class="songs-section">

        <div class="section-heading">

            <div>

                <div class="section-label" data-translation="Треки">
                    TITEL
                </div>

                <h2 data-translation="Песни">
                    Lieder
                </h2>

            </div>

        </div>


        <div id="songs-container" class="songs-grid">

            <div class="loading" data-translation="Загрузка песен ...">
                Lieder werden geladen ...
            </div>

        </div>

    </section>

</main>


<!-- =====================================================
     CUSTOM PLAYER
===================================================== -->

<div id="global-player" class="global-player">

    <div class="player-left">

        <div id="player-cover" class="player-cover"></div>

        <div class="player-info">

            <div id="player-title" class="player-title" data-translation="Сейчас ничего не играет">
                Nichts wird abgespielt
            </div>

            <div id="player-subtitle" class="player-subtitle" data-translation="Исполнитель">
                Rammstein
            </div>

        </div>

    </div>


    <div class="player-center">

        <div class="player-buttons">

            <button
                id="player-prev"
                class="player-button"
            >
                ‹
            </button>


            <button
                id="player-play"
                class="player-play"
            >
                ▶
            </button>


            <button
                id="player-next"
                class="player-button"
            >
                ›
            </button>

        </div>


        <div class="player-progress">

            <span id="player-current">
                0:00
            </span>

            <div
                id="progress-container"
                class="progress-container"
            >
                <div
                    id="progress-bar"
                    class="progress-bar"
                ></div>
            </div>

            <span id="player-duration">
                0:00
            </span>

        </div>

    </div>


    <div class="player-right">

        <a
            id="player-lyrics"
            class="lyrics-button"
            href="/frontend/song.html"
            aria-label="Liedtext öffnen"
            data-translation="Текст песни"
        >
            Tt
        </a>

        <button
            id="player-volume"
            class="volume-button"
        >
            <span data-translation="Громкость">TON</span>
        </button>

        <input
            id="volume-control"
            class="volume-control"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>


    <audio id="global-audio"></audio>

</div>


<script src="/frontend/script.js?v=20260918-8"></script>

</body>

</html>
